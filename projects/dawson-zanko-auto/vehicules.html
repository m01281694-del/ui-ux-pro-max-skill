<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060708">
<!--@head-->
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/boot.js"></script>
</head>
<body data-page="vehicules">
<!--@header-->
<main id="main">
  <section class="page-head" id="recherche">
    <div class="wrap">
      <nav class="crumbs" aria-label="Fil d'Ariane"><a href="/">Accueil</a><span aria-hidden="true">/</span><span aria-current="page">Véhicules</span></nav>
      <h1 class="display" data-split>Le stock</h1>
      <p class="lead">Voitures d'occasion disponibles à Marseille. Décrivez simplement ce que vous cherchez : la recherche comprend la marque, le budget, le kilométrage, l'année, la boîte et l'énergie.</p>
      <form class="smart" role="search" data-smart>
        <div class="smart__box glass">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <label class="sr" for="q">Recherche intelligente</label>
          <input id="q" name="q" type="search" autocomplete="off" placeholder="ex. « SUV diesel automatique moins de 20 000 € »">
          <button class="btn btn--accent btn--sm" type="submit">Rechercher</button>
        </div>
        <div class="smart__understood" data-understood aria-live="polite"></div>
      </form>
    </div>
  </section>

  <div class="wrap catalog">
    <form class="filters" data-filters aria-label="Filtres">
      <div class="filters__head"><h2>Filtres</h2><button type="button" class="round filters__close" data-filters-close aria-label="Fermer les filtres"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div class="fgroup"><label class="sr" for="f-brand">Marque</label><span aria-hidden="true">Marque</span><select class="select" id="f-brand" name="brand"></select></div>
      <div class="fgroup"><label class="sr" for="f-model">Modèle</label><span aria-hidden="true">Modèle</span><select class="select" id="f-model" name="model"></select></div>
      <div class="fgroup"><span>Prix (€)</span><div class="fpair"><label class="sr" for="f-pmin">Prix minimum</label><input class="input" id="f-pmin" name="priceMin" type="number" inputmode="numeric" min="0" step="500" placeholder="Min"><label class="sr" for="f-pmax">Prix maximum</label><input class="input" id="f-pmax" name="priceMax" type="number" inputmode="numeric" min="0" step="500" placeholder="Max"></div></div>
      <div class="fgroup"><label for="f-km">Kilométrage max</label><select class="select" id="f-km" name="kmMax"><option value="">Indifférent</option><option value="20000">20 000 km</option><option value="50000">50 000 km</option><option value="80000">80 000 km</option><option value="100000">100 000 km</option><option value="150000">150 000 km</option></select></div>
      <div class="fgroup"><label for="f-year">Année minimum</label><select class="select" id="f-year" name="yearMin"></select></div>
      <fieldset class="fgroup"><legend>Motorisation</legend><div class="pills" data-pills="fuel"></div></fieldset>
      <fieldset class="fgroup"><legend>Boîte</legend><div class="pills" data-pills="transmission"></div></fieldset>
      <fieldset class="fgroup"><legend>Carrosserie</legend><div class="pills" data-pills="body"></div></fieldset>
      <button type="button" class="btn btn--ghost btn--sm" data-reset>Réinitialiser</button>
    </form>

    <section aria-label="Résultats">
      <div class="results__bar">
        <p class="results__count" data-count aria-live="polite"></p>
        <div class="row-btns">
          <button type="button" class="btn btn--ghost btn--sm filters-toggle" data-filters-open><svg class="i" aria-hidden="true"><use href="#i-filter"/></svg><span>Filtres</span></button>
          <label class="sr" for="sort">Trier</label>
          <select class="select" id="sort" data-sort>
            <option value="relevance">Pertinence</option>
            <option value="price-asc">Prix croissant</option>
            <option value="price-desc">Prix décroissant</option>
            <option value="km-asc">Kilométrage croissant</option>
            <option value="year-desc">Plus récents</option>
          </select>
        </div>
      </div>
      <div class="grid" data-grid></div>
    </section>
  </div>
</main>
<!--@footer-->
<script src="/content/site.js"></script>
<script src="/content/vehicles.js"></script>
<script src="/content/vehicles.example.js"></script>
<script src="/assets/js/smart-search.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/catalogue.js"></script>
</body>
</html>
