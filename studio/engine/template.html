<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Studio template</title>
<style>
/* Moteur : visuel 150-960 (monde zoomable), sous-titres 985-1150, présentateur en bas, mascotte en haut à gauche */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display","Inter",system-ui,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bgGrad);color:var(--text)}
#pat{position:absolute;inset:0;opacity:var(--patOp)}
#world{position:absolute;left:0;right:0;top:0;height:980px;transform-origin:0 0}
.scene{position:absolute;inset:0;opacity:0}
.c{position:absolute;left:0;right:0;text-align:center}
.h{font-weight:900;letter-spacing:-.04em;line-height:.95}
.lab{position:absolute;left:150px;right:150px;top:170px;text-align:center;font-weight:800;font-size:40px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.acc{color:var(--a1)}
.card{position:absolute;left:150px;right:150px;height:170px;border-radius:36px;background:var(--card);color:var(--cardText);display:flex;align-items:center;gap:28px;padding:0 36px;font-weight:900;font-size:52px;letter-spacing:-.02em;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.card i,.tile i,.step i{flex:none;display:grid;place-items:center;font-style:normal}
.card i{width:104px;height:104px;border-radius:28px}
.tile{position:absolute;width:420px;height:300px;border-radius:40px;color:var(--ink);display:grid;place-items:center;align-content:center;gap:14px;font-weight:900;font-size:58px;letter-spacing:-.03em;text-align:center;padding:0 20px;line-height:1;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.vs{position:absolute;top:260px;width:400px;height:470px;border-radius:44px;background:var(--card);color:var(--cardText);display:grid;justify-items:center;align-content:center;gap:16px;text-align:center;padding:30px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.vs b{font-weight:900;font-size:56px;line-height:1;letter-spacing:-.03em}
.vs span{font-weight:700;font-size:34px;opacity:.75;line-height:1.15}
.step{position:absolute;left:170px;right:150px;height:120px;display:flex;align-items:center;gap:28px;font-weight:900;font-size:50px}
.step i{width:96px;height:96px;border-radius:50%;background:var(--card);color:var(--cardText);font-size:44px;font-weight:900}
.bubble{position:absolute;padding:28px 66px;border-radius:60px 60px 14px 60px;background:var(--a2);color:var(--ink);font-weight:900;font-size:140px;letter-spacing:.02em;white-space:nowrap}
#caps{position:absolute;left:60px;right:60px;top:985px;height:170px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px 16px;font-weight:900;font-size:68px;line-height:1.12;letter-spacing:-.02em;z-index:20;color:var(--text)}
#caps span{padding:0 12px;border-radius:16px;text-shadow:var(--capShadow)}
#caps.pill span.on{background:var(--a1);color:var(--ink);text-shadow:none}
#caps.color span.on{color:var(--a1);box-shadow:inset 0 -10px 0 color-mix(in srgb,var(--a1) 35%,transparent)}
#caps.box{background:var(--capBox);border-radius:30px;left:90px;right:90px}
#caps.box span.on{color:var(--a1)}
#bar{position:absolute;left:0;top:0;height:12px;background:var(--a1);z-index:30}
#disc{position:absolute;left:180px;top:1250px;width:720px;height:720px;border-radius:50%;background:var(--disc)}
#host{position:absolute;left:220px;top:1150px;width:640px;height:760px;z-index:10;overflow:visible}
#mascot{position:absolute;left:30px;top:172px;width:112px;height:112px;z-index:25;overflow:visible}
#emote{position:absolute;left:128px;top:146px;width:76px;height:76px;border-radius:24px 24px 24px 6px;background:#fff;display:grid;place-items:center;font-size:42px;z-index:25;opacity:0;font-family:"Noto Color Emoji",sans-serif}
</style></head>
<body><script src="vendor/three.min.js"></script><div id="stage"><div id="pat"></div><canvas id="three" width="540" height="960" style="position:absolute;inset:0;width:1080px;height:1920px"></canvas><div id="veil" style="position:absolute;inset:0"></div><div id="bar"></div><div id="world"></div><div id="caps"></div>
<svg id="mascot" viewBox="0 0 100 100"><g id="mg">
 <path d="M50 22 C50 14 54 10 58 8" stroke="var(--a1)" stroke-width="3" fill="none" stroke-linecap="round"/>

 <path d="M20 58 C20 34 34 22 50 22 C66 22 80 34 80 58 C80 78 68 88 50 88 C32 88 20 78 20 58Z" fill="var(--mascot)"/>

 <ellipse id="m-arm1" cx="17" cy="62" rx="6" ry="9" fill="var(--mascot)"/><ellipse id="m-arm2" cx="83" cy="62" rx="6" ry="9" fill="var(--mascot)"/>
 <g id="m-eyes"><ellipse cx="40" cy="55" rx="5" ry="7" fill="#1B1430"/><ellipse cx="60" cy="55" rx="5" ry="7" fill="#1B1430"/><circle cx="41.6" cy="52.5" r="1.8" fill="#fff"/><circle cx="61.6" cy="52.5" r="1.8" fill="#fff"/></g>
 <ellipse cx="32" cy="66" rx="5" ry="3" fill="#FF8FC0" opacity=".8"/><ellipse cx="68" cy="66" rx="5" ry="3" fill="#FF8FC0" opacity=".8"/>
 <path d="M45 66 Q50 71 55 66" stroke="#1B1430" stroke-width="2.6" fill="none" stroke-linecap="round"/></g></svg>
<div id="emote"></div><div id="disc"></div><svg id="host" viewBox="0 0 640 760"></svg>
</div>
<script>
"use strict";
const SPEC = window.SPEC, TL = window.TL;
const $ = id => document.getElementById(id);
const cl = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eb = x => { x = cl(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const P = (t, a, d) => cl((t - a) / d);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const norm = w => String(w).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
let SEED = 0; for (const ch of SPEC.id) SEED = (SEED * 31 + ch.charCodeAt(0)) >>> 0;
const rnd = () => { SEED = (SEED * 1664525 + 1013904223) >>> 0; return SEED / 4294967296; };

/* ---------- styles ---------- */
const STYLES = {
 forest:  {bg:["#14503D","#0C2B22","#08201A"], a1:"#C8F45A", a2:"#FF6FAE", a3:"#FFD34D", text:"#FFFFFF", muted:"rgba(255,255,255,.65)", card:"#FFFFFF", cardText:"#0C2B22", ink:"#0C2B22", disc:"radial-gradient(circle at 50% 30%,#D9FF7A,#A8D83A 70%)", mascot:"#C9B6FF", pat:"grid"},
 navy:    {bg:["#1A1F57","#0F1235","#0A0C26"], a1:"#FF6A2B", a2:"#FFD23F", a3:"#3D7BFF", text:"#FFF3E2", muted:"rgba(255,243,226,.62)", card:"#FFF3E2", cardText:"#0F1235", ink:"#0F1235", disc:"radial-gradient(circle at 50% 35%,#4F8BFF,#2A4FD6 70%)", mascot:"#FFB38A", pat:"dots"},
 sunset:  {bg:["#5A1A4A","#2A0F2E","#1A0820"], a1:"#FFB13D", a2:"#FF4F8B", a3:"#8EE3EF", text:"#FFF4EC", muted:"rgba(255,244,236,.65)", card:"#FFF4EC", cardText:"#2A0F2E", ink:"#2A0F2E", disc:"radial-gradient(circle at 50% 30%,#FFCF6B,#FF8A3D 70%)", mascot:"#8EE3EF", pat:"diag"},
 ocean:   {bg:["#0A5A80","#04263F","#021A2C"], a1:"#3EE6C1", a2:"#FFE066", a3:"#FF7A59", text:"#F2FBFF", muted:"rgba(242,251,255,.65)", card:"#F2FBFF", cardText:"#04263F", ink:"#04263F", disc:"radial-gradient(circle at 50% 30%,#7FF5DA,#21B894 70%)", mascot:"#FFE066", pat:"dots"},
 paper:   {bg:["#FBF7EE","#F3ECDD","#E9DFCB"], a1:"#E5484D", a2:"#1F6FEB", a3:"#F2B705", text:"#1E1B16", muted:"rgba(30,27,22,.6)", card:"#FFFFFF", cardText:"#1E1B16", ink:"#FFFFFF", disc:"radial-gradient(circle at 50% 30%,#FFD86B,#F2B705 70%)", mascot:"#FF9E7A", pat:"grid", light:true},
 electric:{bg:["#232323","#0E0E0E","#050505"], a1:"#D4FF00", a2:"#7A5CFF", a3:"#FFFFFF", text:"#FFFFFF", muted:"rgba(255,255,255,.6)", card:"#FFFFFF", cardText:"#0E0E0E", ink:"#0E0E0E", disc:"radial-gradient(circle at 50% 30%,#9C88FF,#5B3DF5 70%)", mascot:"#D4FF00", pat:"diag"},
 candy:   {bg:["#6B3AE0","#3B1D8F","#26115F"], a1:"#FFE45E", a2:"#FFB3E6", a3:"#8CFFDA", text:"#FFFFFF", muted:"rgba(255,255,255,.7)", card:"#FFFFFF", cardText:"#3B1D8F", ink:"#26115F", disc:"radial-gradient(circle at 50% 30%,#B5FFE9,#5EE6B8 70%)", mascot:"#FFB3E6", pat:"dots"},
 cherry:  {bg:["#7A1A2C","#3A0A12","#25060C"], a1:"#FFC857", a2:"#FF5A5F", a3:"#8EE3EF", text:"#FFF1F1", muted:"rgba(255,241,241,.65)", card:"#FFF1F1", cardText:"#3A0A12", ink:"#3A0A12", disc:"radial-gradient(circle at 50% 30%,#FFE08A,#FFB020 70%)", mascot:"#8EE3EF", pat:"grid"}
};
const ST = STYLES[SPEC.style] || STYLES.forest;
{ const r = document.documentElement.style;
  r.setProperty("--bgGrad", `radial-gradient(120% 70% at 50% 30%, ${ST.bg[0]} 0%, ${ST.bg[1]} 60%, ${ST.bg[2]} 100%)`);
  ["a1","a2","a3","text","muted","card","cardText","ink","disc","mascot"].forEach(k => r.setProperty("--"+k, ST[k]));
  r.setProperty("--capShadow", ST.light ? "none" : "0 5px 0 rgba(0,0,0,.5)");
  r.setProperty("--capBox", ST.light ? "rgba(255,255,255,.85)" : "rgba(0,0,0,.35)");
  const pc = ST.light ? "rgba(0,0,0,.06)" : "rgba(255,255,255,.07)";
  const pat = { grid:`linear-gradient(${pc} 2px,transparent 2px),linear-gradient(90deg,${pc} 2px,transparent 2px)`, dots:`radial-gradient(${pc} 3px,transparent 3.5px)`, diag:`repeating-linear-gradient(45deg,${pc} 0 3px,transparent 3px 46px)` }[ST.pat];
  $("pat").style.background = pat; $("pat").style.backgroundSize = ST.pat === "diag" ? "auto" : "70px 70px"; r.setProperty("--patOp", 1);
  $("caps").className = SPEC.captions || ["pill","color","box"][Math.floor(rnd()*3)];
}

/* ---------- couche 3D ---------- */
let render3d = () => {};
if (window.THREE && SPEC.three !== false) {
  $("veil").style.background = `radial-gradient(ellipse 62% 30% at 50% 29%, color-mix(in srgb, ${ST.bg[1]} 72%, transparent), transparent 100%)`;
  const cv = $("three"); const r3 = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true});
  r3.setPixelRatio(1); r3.setSize(540, 960, false);
  const sc = new THREE.Scene(); sc.fog = new THREE.Fog(new THREE.Color(ST.bg[1]), 9, 24);
  const cam = new THREE.PerspectiveCamera(55, 540/960, .1, 80);
  sc.add(new THREE.HemisphereLight(0xffffff, new THREE.Color(ST.bg[2]), .85));
  const dl = new THREE.DirectionalLight(0xffffff, .95); dl.position.set(3, 6, 7); sc.add(dl);
  const pl = new THREE.PointLight(new THREE.Color(ST.a2), 1.4, 22); pl.position.set(-4, 3, 2); sc.add(pl);
  const C = [ST.a1, ST.a2, ST.a3].map(c => new THREE.Color(c));
  const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, metalness: .35, roughness: .32}, o));
  const MODE = SPEC.scene3d || ["orbit", "phone", "grid", "bars", "knots"][Math.floor(rnd()*5)];
  const objs = []; const add = (m, x, y, z, spin) => { m.position.set(x, y, z); m.userData = {x, y, z, spin, ph: rnd()*6.28}; sc.add(m); objs.push(m); return m; };
  const G = [() => new THREE.IcosahedronGeometry(.7, 0), () => new THREE.TorusGeometry(.6, .22, 16, 40), () => new THREE.SphereGeometry(.55, 24, 16),
             () => new THREE.BoxGeometry(.9, .9, .9), () => new THREE.OctahedronGeometry(.7, 0), () => new THREE.ConeGeometry(.55, 1.1, 24)];
  if (MODE === "orbit") { for (let i = 0; i < 16; i++) { const a = rnd()*6.28, rad = 3.2 + rnd()*3; add(new THREE.Mesh(G[i % G.length](), M(C[i % 3])), Math.cos(a)*rad, -3.5 + rnd()*9, -3 - rnd()*7, .3 + rnd()*.8); } }
  if (MODE === "phone") { const side = rnd() < .5 ? -1 : 1; const ph = add(new THREE.Mesh(new THREE.BoxGeometry(2.4, 4.8, .26), M(0x151515, {metalness: .6, roughness: .25})), side*3.6, 2.6, -7, 0);
    ph.userData.phone = side; const scr = new THREE.Mesh(new THREE.PlaneGeometry(2.15, 4.5), new THREE.MeshBasicMaterial({color: C[1]})); scr.position.z = .14; ph.add(scr);
    for (let k = 0; k < 4; k++) { const bar = new THREE.Mesh(new THREE.PlaneGeometry(1.6 - k*.2, .28), new THREE.MeshBasicMaterial({color: k % 2 ? C[0] : C[2]})); bar.position.set(0, 1.4 - k*.7, .15); ph.add(bar); }
    for (let i = 0; i < 9; i++) { add(new THREE.Mesh(new THREE.TorusGeometry(.3, .11, 12, 30), M(C[(i+1) % 3])), (i % 2 ? 1 : -1)*(2.2 + rnd()*2.2), .5 + rnd()*6, -4 - rnd()*4, .6); } }
  if (MODE === "grid") { const gh = new THREE.GridHelper(60, 40, C[0], C[1]); gh.position.set(0, -3.2, -10); sc.add(gh); objs.push(Object.assign(gh, {userData: {grid: true}}));
    const sun = add(new THREE.Mesh(new THREE.CircleGeometry(3.2, 48), new THREE.MeshBasicMaterial({color: C[2]})), 0, 2.4, -22, 0);
    for (let i = 0; i < 10; i++) add(new THREE.Mesh(new THREE.BoxGeometry(.8, .8, .8), M(C[i % 3], {wireframe: i % 2 === 0})), (i % 2 ? 1 : -1)*(2.5 + rnd()*3), -1 + rnd()*6, -4 - rnd()*8, .5); }
  if (MODE === "bars") { for (let i = 0; i < 7; i++) { const b = add(new THREE.Mesh(new THREE.BoxGeometry(.8, 1, .8), M(C[i % 3])), -3.6 + i*1.2, -3, -7, 0); b.userData.bar = 1 + i*.7 + rnd(); }
    for (let i = 0; i < 6; i++) add(new THREE.Mesh(G[i % G.length](), M(C[(i+2) % 3])), (i % 2 ? 1 : -1)*(3 + rnd()*2), 2 + rnd()*4, -5 - rnd()*4, .5); }
  if (MODE === "knots") { [[-2.6, 3.4, -6], [2.8, 1, -7], [0, -1.8, -9]].forEach((p, i) => add(new THREE.Mesh(new THREE.TorusKnotGeometry(1, .32, 160, 20, 2 + i, 3), M(C[i])), p[0], p[1], p[2], .35));
    for (let i = 0; i < 8; i++) add(new THREE.Mesh(new THREE.SphereGeometry(.25, 16, 12), M(C[i % 3])), -4 + rnd()*8, -3 + rnd()*8, -3 - rnd()*6, 0); }
  render3d = (t, segIdx, pulse) => {
    const sx = ((segIdx % 3) - 1) * 1.1; cam.position.set(Math.sin(t*.17)*1.4 + sx*.6, .6 + Math.sin(t*.11)*.5, 9 - pulse*.6); cam.lookAt(sx*.3, 1, -4);
    objs.forEach((o, i) => { const u = o.userData;
      if (u.grid) { o.position.z = -10 + (t*2.2 % 1.5); return; }
      if (u.bar) { const h = u.bar * (.3 + .7*Math.min(1, t / (TL.duration*.8))) * (1 + pulse*.2); o.scale.y = h; o.position.y = -3 + h/2; o.rotation.y = t*.2; return; }
      if (u.phone) { o.position.y = u.y + Math.sin(t*.7)*.25; o.rotation.set(Math.sin(t*.5)*.08, -u.phone*.45 + Math.sin(t*.4)*.18, 0); const k = 1 + pulse*.06; o.scale.set(k, k, k); return; }
      o.position.y = u.y + Math.sin(t*.9 + u.ph)*.35; o.rotation.x = t*u.spin*.7 + u.ph; o.rotation.y = t*u.spin + u.ph;
      const sc2 = 1 + pulse*.18; o.scale.set(sc2, sc2, sc2); });
    r3.render(sc, cam); };
  window.MODE3D = MODE;
}

/* ---------- icônes ---------- */
const IC = {
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>',
 heart:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="currentColor"/>',
 star:'<path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="currentColor"/>',
 tag:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>', arrow:'<path d="M3 12h16M13 6l6 6-6 6"/>',
 key:'<circle cx="8" cy="8" r="5"/><path d="M11.5 11.5 21 21M17 17l2-2M15 15l2-2"/>',
 rocket:'<path d="M12 2c4 3 6 7 5 12l-3 3h-4l-3-3C6 9 8 5 12 2z"/><circle cx="12" cy="9" r="2"/><path d="M8 17l-3 4M16 17l3 4"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>', money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M17 4a4 4 0 0 1 0 8M22 21c0-3-2-6-5-7"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>', megaphone:'<path d="M3 10h4l10-6v16L7 14H3z"/><path d="M7 14v5"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',
 check:'<path d="M4 12l5 5L20 6"/>', cross:'<path d="M5 5l14 14M19 5L5 19"/>', phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', cart:'<path d="M3 4h2l2 12h11l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>',
 lock:'<rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', gift:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9C10 4 6 5 7 8M12 9c2-5 6-4 5-1"/>',
 fire:'<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-6 6-6 9-1-1-2-2-2-4-1 2-1 4-1 6 0 4 3 8 7 8z"/>', book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-5a3 3 0 0 0-1 0"/><path d="M20 4v14h-6"/>'
};
const icon = (n, size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="color:${color}">${IC[n] || IC.star}</svg>`;

/* ---------- temps ---------- */
const W = TL.words.map(w => ({...w, n: norm(w.w)}));
const SEG = Object.fromEntries(TL.segs.map((s,i) => [s.id, {...s, next: TL.segs[i+1] ? TL.segs[i+1].start : TL.duration, idx:i}]));
const ORDER = TL.segs.map(s => s.id);
const K = (seg, needle) => { if (needle == null) return SEG[seg].start; const nn = norm(needle); const m = W.find(w => w.seg === seg && w.n.includes(nn)); return m ? m.a : SEG[seg].start + .3; };
const CHUNKS = []; { let cur = [];
  W.forEach((w,i) => { cur.push(w); const nx = W[i+1]; if (cur.length >= 4 || (/[.?!:,]$/.test(w.w) && cur.length >= 2) || /[.?!:]$/.test(w.w) || !nx || nx.seg !== w.seg || nx.a - w.b > .35) { CHUNKS.push(cur); cur = []; } }); }

/* ---------- utilitaires d'animation ---------- */
const set = (e, o, tf) => { e.style.opacity = o; if (tf !== undefined) e.style.transform = tf; };
const pop = (e, t, a, d=.3, dy=60) => { const p = P(t,a,d); set(e, eo(p), `translateY(${(1-eb(p))*dy}px) scale(${.85+.15*eb(p)})`); };
const slam = (e, t, a) => { const p = P(t,a,.28); set(e, eo(p), `scale(${1.7 - .7*eo(p)})`); };
const mk = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const COLORS = () => [ST.a1, ST.a2, ST.a3, ST.card];

/* ---------- scènes ---------- */
const PUNCH = [], GEST = [], EMO = {bigword:"❗",cards:"💡",tiles:"🔑",versus:"⚔️",stat:"📊",steps:"🪜",quote:"💬",arrow:"✨",save:"🔖",cta:"📩"};
