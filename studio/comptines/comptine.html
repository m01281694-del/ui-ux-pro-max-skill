<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Comptine</title>
<style>
/* Comptine verticale : décor 3D plein écran, titre en haut, karaoké au tiers inférieur */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display","Inter",system-ui,sans-serif;background:#87CEEB}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
#badge{position:absolute;left:50%;top:190px;transform:translateX(-50%);padding:18px 40px;border-radius:999px;background:rgba(255,255,255,.92);color:#5B3A8C;font-weight:900;font-size:46px;white-space:nowrap;box-shadow:0 14px 30px -14px rgba(60,30,100,.5)}
#title{position:absolute;left:60px;right:60px;top:520px;text-align:center;font-weight:900;font-size:150px;line-height:.95;letter-spacing:-.02em;color:#fff;-webkit-text-stroke:14px #5B3A8C;paint-order:stroke fill;text-shadow:0 14px 0 rgba(91,58,140,.35)}
#sub{position:absolute;left:0;right:0;top:880px;text-align:center;font-weight:900;font-size:56px;color:#fff;-webkit-text-stroke:8px #5B3A8C;paint-order:stroke fill}
#kara{position:absolute;left:40px;right:40px;top:1180px;height:330px;border-radius:60px;background:rgba(255,255,255,.88);box-shadow:0 30px 60px -30px rgba(60,30,100,.55);display:grid;align-content:center;justify-items:center;gap:18px;padding:20px 30px}
#line{display:flex;flex-wrap:wrap;justify-content:center;gap:0;font-weight:900;font-size:84px;line-height:1.1;color:#B9A6D8;letter-spacing:-.01em}
#line span{position:relative;display:inline-block}
#line .wd{display:inline-flex;white-space:nowrap;margin:0 13px;font-weight:900}
#line span.done{color:#5B3A8C}
#line span.on{color:#FF5A8A}
#next{font-weight:800;font-size:44px;color:#9C8BBF;text-align:center}
#ball{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6B0,#FFC531 60%,#F29A00);box-shadow:0 6px 10px rgba(0,0,0,.2);z-index:5}
#notes{position:absolute;inset:0;pointer-events:none}
.nt{position:absolute;font-size:70px;color:#fff;-webkit-text-stroke:6px #5B3A8C;paint-order:stroke fill;font-weight:900}
</style></head>
<body><script src="../engine/vendor/three.min.js"></script>
<div id="stage"><canvas id="gl" width="540" height="960"></canvas><div id="notes"></div>
<div id="badge"></div><div id="title"></div><div id="sub"></div>
<div id="kara"><div id="line"></div><div id="next"></div></div><div id="ball"></div></div>
<script>
"use strict";
const SPEC = window.SPEC, TL = window.TL;
const $ = id => document.getElementById(id);
const cl = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eb = x => { x = cl(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const P = (t, a, d) => cl((t - a) / d);
let SEED = 7; for (const ch of SPEC.id) SEED = (SEED * 31 + ch.charCodeAt(0)) >>> 0;
const rnd = () => { SEED = (SEED * 1664525 + 1013904223) >>> 0; return SEED / 4294967296; };
window.PUNCH_TIMES = [];

const THEMES = {
  matin:  {sky:0x8FD3FF, fog:0xBFE8FF, ground:0x7BD66B, ground2:0x5CBF52, light:0xFFFFFF, celestial:"sun"},
  nuit:   {sky:0x1D2A6B, fog:0x2B3A80, ground:0x2F6F5A, ground2:0x245848, light:0xBFC8FF, celestial:"moon"},
  etoiles:{sky:0x6B4FC8, fog:0x8A6FE0, ground:0x9C7BE8, ground2:0x7E5CD6, light:0xFFE9FF, celestial:"moon"},
  ferme:  {sky:0xA8E6FF, fog:0xD8F4FF, ground:0x9BDB5A, ground2:0x7CC444, light:0xFFFFFF, celestial:"sun"},
  mer:    {sky:0x7FD6FF, fog:0xBDEBFF, ground:0x3FA9F5, ground2:0x2E8FD9, light:0xFFFFFF, celestial:"sun"}
};
const TH = THEMES[SPEC.theme] || THEMES.matin;
const ANIMALS = {
  ours:   {body:0xC98A55, belly:0xF2D3A8, ear:"round"},
  chat:   {body:0xFFB15C, belly:0xFFE7C2, ear:"pointy"},
  lapin:  {body:0xF4F0FF, belly:0xFFD6E8, ear:"long"},
  souris: {body:0xB9B9C9, belly:0xF0E6F0, ear:"big"},
  poussin:{body:0xFFD93D, belly:0xFFF0A0, ear:"none"},
  grenouille:{body:0x6CD45E, belly:0xD8F7B0, ear:"eyes"}
};
const AN = ANIMALS[SPEC.animal] || ANIMALS.ours;

/* ---------- 3D ---------- */
const r3 = new THREE.WebGLRenderer({canvas: $("gl"), antialias: true, preserveDrawingBuffer: true});
r3.setPixelRatio(1); r3.setSize(540, 960, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(TH.sky); scene.fog = new THREE.Fog(TH.fog, 14, 40);
const cam = new THREE.PerspectiveCamera(50, 540/960, .1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, TH.ground2, .95));
const sunL = new THREE.DirectionalLight(TH.light, .9); sunL.position.set(4, 8, 6); scene.add(sunL);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: .55, metalness: .05}, o));
const S = (r, c, ws = 32) => new THREE.Mesh(new THREE.SphereGeometry(r, ws, ws/2|0), M(c));
// sol et collines
const hill = (r, c, x, y, z, sy) => { const h = S(r, c, 48); h.scale.y = sy; h.position.set(x, y, z); scene.add(h); return h; };
hill(30, TH.ground, 0, -31.2, -8, 1); hill(9, TH.ground2, -10, -6.5, -22, .7); hill(11, TH.ground2, 12, -8, -26, .7);
if (SPEC.theme === "mer") { const sea = new THREE.Mesh(new THREE.CircleGeometry(60, 64), M(0x2E8FD9, {roughness: .2})); sea.rotation.x = -Math.PI/2; sea.position.set(0, -1.15, -20); scene.add(sea); }
// astre
let cel; if (TH.celestial === "sun") { cel = new THREE.Group(); cel.add(new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 16), new THREE.MeshBasicMaterial({color: 0xFFD84D})));
  for (let i = 0; i < 12; i++) { const ray = new THREE.Mesh(new THREE.ConeGeometry(.25, .9, 12), new THREE.MeshBasicMaterial({color: 0xFFB23D})); const a = i/12*Math.PI*2; ray.position.set(Math.cos(a)*2.3, Math.sin(a)*2.3, 0); ray.rotation.z = a - Math.PI/2; cel.add(ray); }
  cel.position.set(4.2, 8.5, -12); scene.add(cel);
} else { cel = new THREE.Mesh(new THREE.SphereGeometry(1.8, 32, 16), new THREE.MeshBasicMaterial({color: 0xFFF3B0})); cel.position.set(-4, 8.8, -14); scene.add(cel); }
// nuages
const clouds = []; for (let i = 0; i < 6; i++) { const g = new THREE.Group(); for (let k = 0; k < 4; k++) { const p = S(.8 + rnd()*.6, 0xFFFFFF); p.position.set(k*1 - 1.5, rnd()*.4, rnd()*.3); g.add(p); }
  g.position.set(-12 + i*5, 5 + rnd()*5, -10 - rnd()*8); g.userData.sp = .2 + rnd()*.3; scene.add(g); clouds.push(g); }
// étoiles
const stars = []; if (TH.celestial === "moon") for (let i = 0; i < 40; i++) { const st = new THREE.Mesh(new THREE.OctahedronGeometry(.16 + rnd()*.12), new THREE.MeshBasicMaterial({color: 0xFFF6C8})); st.position.set(-14 + rnd()*28, 3 + rnd()*12, -14 - rnd()*10); st.userData.ph = rnd()*6; scene.add(st); stars.push(st); }
// fleurs / bonbons / bouées
const deco = []; for (let i = 0; i < 14; i++) { const g = new THREE.Group(); const cols = [0xFF6FA8, 0xFFD34D, 0x8C7BFF, 0xFF8A3D, 0x4DD6C9];
  if (SPEC.theme === "etoiles") { const c = S(.35, cols[i % 5]); g.add(c); const w1 = new THREE.Mesh(new THREE.ConeGeometry(.22, .4, 12), M(cols[(i+1) % 5])); w1.rotation.z = Math.PI/2; w1.position.x = .45; g.add(w1); const w2 = w1.clone(); w2.rotation.z = -Math.PI/2; w2.position.x = -.45; g.add(w2); }
  else { const st = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .7, 8), M(0x3E9B3A)); st.position.y = .35; g.add(st); for (let k = 0; k < 5; k++) { const pe = S(.16, cols[i % 5], 12); const a = k/5*Math.PI*2; pe.position.set(Math.cos(a)*.2, .75, Math.sin(a)*.2); g.add(pe); } const cc = S(.12, 0xFFF3A0, 12); cc.position.y = .78; g.add(cc); }
  const side = i % 2 ? 1 : -1; g.position.set(side*(2.2 + rnd()*5), -1 + (SPEC.theme === "etoiles" ? 1 + rnd()*5 : 0), -2 - rnd()*8); g.userData.ph = rnd()*6; scene.add(g); deco.push(g); }

// animal 3D original fait de formes simples
const pet = new THREE.Group(); scene.add(pet);
const body = S(1.15, AN.body, 48); body.scale.set(1, 1.05, .95); body.position.y = .2; pet.add(body);
const belly = S(.78, AN.belly, 40); belly.scale.set(1, 1.1, .5); belly.position.set(0, .05, .7); pet.add(belly);
const head = new THREE.Group(); head.position.y = 1.85; pet.add(head);
const skull = S(1.0, AN.body, 48); head.add(skull);
const snout = S(.42, AN.belly, 32); snout.scale.set(1.2, .85, .8); snout.position.set(0, -.25, .82); head.add(snout);
const nose = S(.12, 0x3A2A33, 16); nose.position.set(0, -.12, 1.15); head.add(nose);
const eyeM = M(0x1B1430, {roughness: .2}); const eyes = [];
[-.36, .36].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(.15, 24, 12), eyeM); e.position.set(x, .18, .86); head.add(e); eyes.push(e);
  const hl = new THREE.Mesh(new THREE.SphereGeometry(.05, 12, 8), new THREE.MeshBasicMaterial({color: 0xffffff})); hl.position.set(x + .05, .24, .99); head.add(hl); eyes.push(hl);
  const ck = S(.16, 0xFF8FB5, 16); ck.scale.set(1, .6, .4); ck.position.set(x * 1.7, -.15, .74); head.add(ck); });
const mouth = new THREE.Mesh(new THREE.SphereGeometry(.13, 20, 10), M(0x7A2338)); mouth.scale.set(1.2, .3, .5); mouth.position.set(0, -.48, .98); head.add(mouth);
const ears = [];
[-1, 1].forEach(s => { let ear;
  if (AN.ear === "round") { ear = S(.34, AN.body); ear.position.set(s*.72, .78, 0); }
  else if (AN.ear === "pointy") { ear = new THREE.Mesh(new THREE.ConeGeometry(.32, .7, 24), M(AN.body)); ear.position.set(s*.6, .95, 0); ear.rotation.z = -s*.35; }
  else if (AN.ear === "long") { ear = S(.26, AN.body); ear.scale.set(.8, 3, .6); ear.position.set(s*.38, 1.5, -.05); ear.rotation.z = -s*.15; }
  else if (AN.ear === "big") { ear = S(.55, AN.body); ear.scale.set(1, 1, .3); ear.position.set(s*.85, .7, -.1); }
  else if (AN.ear === "eyes") { ear = S(.32, AN.body); ear.position.set(s*.45, .85, .25); }
  if (ear) { head.add(ear); ears.push(ear); } });
if (AN.ear === "none") { const beak = new THREE.Mesh(new THREE.ConeGeometry(.2, .45, 16), M(0xFF8A2B)); beak.rotation.x = Math.PI/2; beak.position.set(0, -.2, 1.1); head.add(beak); snout.visible = false; nose.visible = false; }
const arms = []; [-1, 1].forEach(s => { const a = S(.3, AN.body, 20); a.scale.set(.8, 1.4, .8); a.position.set(s*1.05, .55, .2); pet.add(a); arms.push(a); });
const feet = []; [-1, 1].forEach(s => { const f = S(.36, AN.body, 20); f.scale.set(1.1, .6, 1.3); f.position.set(s*.55, -.9, .35); pet.add(f); feet.push(f); });
pet.position.set(0, -.7, 0); pet.scale.setScalar(1.15);

/* ---------- textes ---------- */
$("badge").textContent = "♪ " + SPEC.titre;
$("title").textContent = SPEC.titre;
$("sub").textContent = SPEC.sous_titre || "Chante avec nous !";
const LINES = TL.lines;
let lastLine = -1, spans = [];
function setLine(i){ if (i === lastLine) return; lastLine = i; const L = LINES[i];
  const words = []; let cur = null; spans = [];
  L.syl.forEach(s => { if (!cur) { cur = document.createElement("b"); cur.className = "wd"; words.push(cur); }
    const e = document.createElement("span"); e.textContent = s.text; cur.appendChild(e); spans.push(e); if (s.w) cur = null; });
  $("line").replaceChildren(...words); $("line").style.fontSize = (L.text.length > 24 ? 70 : 84) + "px";
  const nx = LINES[i + 1]; $("next").textContent = nx && nx.rep === L.rep ? nx.text : ""; }
const NOTES = []; for (let i = 0; i < 6; i++) { const e = document.createElement("div"); e.className = "nt"; e.textContent = ["♪","♫","♬"][i % 3]; $("notes").appendChild(e); NOTES.push({e, x: 120 + rnd()*840, ph: rnd()*6}); }

function render(t){
  // caméra
  cam.position.set(Math.sin(t*.25)*1.6, 2.4 + Math.sin(t*.2)*.3, 10.5 - Math.min(1.5, t*.05)); cam.lookAt(0, 1.6, 0);
  clouds.forEach(c => { c.position.x = ((c.position.x + 14 + c.userData.sp/30) % 28) - 14; });
  clouds.forEach((c, i) => { c.position.x = -14 + ((i*5 + t*c.userData.sp) % 28); });
  stars.forEach(s => { const k = .6 + .4*Math.abs(Math.sin(t*2 + s.userData.ph)); s.scale.setScalar(k); });
  if (cel) cel.rotation.z = t*.15;
  deco.forEach(d => { d.rotation.z = Math.sin(t*2 + d.userData.ph)*.12; d.position.y += 0; });
  // battement : syllabe en cours
  const cur = TL.syl.find(s => t >= s.t && t < s.t + s.d); const bt = cur ? (t - cur.t) / Math.max(.1, cur.d) : 1;
  const hop = cur ? Math.sin(Math.min(1, bt) * Math.PI) : 0;
  pet.position.y = -.7 + hop*.35; pet.rotation.y = Math.sin(t*1.6)*.35; pet.rotation.z = Math.sin(t*3.2)*.05;
  head.rotation.z = Math.sin(t*2.4)*.12; head.rotation.x = -hop*.08;
  arms.forEach((a, i) => { a.rotation.z = (i ? -1 : 1) * (.3 + hop*.9 + (t > TL.outro ? Math.abs(Math.sin(t*8))*.8 : 0)); });
  feet.forEach((f, i) => { f.position.y = -.9 + (i === (cur ? cur.i % 2 : 0) ? hop*.15 : 0); });
  const open = cur ? .3 + .7*Math.sin(Math.min(1, bt*1.4) * Math.PI) : (t < TL.intro ? .2 : .05);
  mouth.scale.set(1.1 - open*.3, .25 + open*1.1, .5);
  const blink = (t % 3.3) < .12; eyes.forEach((e, i) => { if (i % 2 === 0) e.scale.y = blink ? .15 : 1; });
  deco.forEach((d, i) => { const s = 1 + (cur ? hop*.12 : 0); d.scale.setScalar(s); });
  r3.render(scene, cam);
  // notes de musique flottantes
  NOTES.forEach((n, i) => { const y = 1150 - ((t*90 + i*160) % 900); n.e.style.left = (n.x + Math.sin(t*2 + n.ph)*30) + "px"; n.e.style.top = y + "px"; n.e.style.opacity = t < TL.intro ? 0 : .85; });
  // titre / intro / outro
  const ti = P(t, .1, .5), to = P(t, TL.intro - .4, .4);
  $("title").style.opacity = eo(ti) * (1 - to); $("title").style.transform = `scale(${.5 + .5*eb(ti)}) rotate(${Math.sin(t*3)*2}deg)`;
  $("sub").style.opacity = eo(P(t, .6, .4)) * (1 - to);
  const oo = P(t, TL.outro, .5);
  if (t >= TL.outro) { $("title").textContent = SPEC.fin || "Bravo !"; $("title").style.opacity = eo(oo); $("title").style.transform = `scale(${.5 + .5*eb(oo)}) rotate(${Math.sin(t*3)*3}deg)`; $("sub").textContent = "À bientôt pour une nouvelle comptine !"; $("sub").style.opacity = eo(P(t, TL.outro + .4, .4)); }
  $("badge").style.opacity = eo(P(t, TL.intro - .2, .4));
  // karaoké
  const kOn = t >= TL.intro - .3 && t < TL.outro; $("kara").style.opacity = kOn ? eo(P(t, TL.intro - .3, .3)) : 0; $("ball").style.opacity = 0;
  if (kOn) { let li = LINES.findIndex(L => t < L.end + .05); if (li < 0) li = LINES.length - 1; li = Math.max(0, li); setLine(li);
    const L = LINES[li]; spans.forEach((sp, k) => { const s = L.syl[k]; sp.className = t >= s.t + s.d ? "done" : t >= s.t ? "on" : ""; sp.style.transform = t >= s.t && t < s.t + s.d ? `translateY(${-hop*14}px) scale(1.08)` : ""; });
    let k = L.syl.findIndex(s => t < s.t + s.d); if (k < 0) k = L.syl.length - 1;
    const sp = spans[k]; if (sp) { const r = sp.getBoundingClientRect(); const s = L.syl[k]; const ph = cl((t - s.t) / s.d);
      let x = r.left + r.width/2, prev = spans[k-1];
      if (t < s.t && prev) { const pr = prev.getBoundingClientRect(); const ps = L.syl[k-1]; const q = cl((t - (ps.t + ps.d)) / Math.max(.05, s.t - ps.t - ps.d)); x = pr.left + pr.width/2 + (x - pr.left - pr.width/2) * q; }
      const y = r.top - 40 - Math.sin(ph * Math.PI) * 50; $("ball").style.left = (x - 22) + "px"; $("ball").style.top = y + "px"; $("ball").style.opacity = 1; } }
}
window.render = render;
</script></body></html>
